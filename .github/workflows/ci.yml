name: Offline cache regressions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline check tools
        run: |
          python -m pip install pandas pytest ruff build hatchling
          python -m pip install --no-deps -e .
      - name: Check changed Python files
        run: |
          ruff check src/lablens/ingestion/cache.py tests/test_document_cache.py
          ruff format --check src/lablens/ingestion/cache.py tests/test_document_cache.py
      - name: Run offline regressions
        run: python -m pytest tests/test_document_cache.py -q
      - name: Build wheel
        run: python -m build --wheel --no-isolation
