services:
  # FastAPI Backend Service
  api:
    build: .
    container_name: lablens-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    command: >
      sh -c "
        echo 'Setting up knowledge base...' &&
        uv run scripts/setup_knowledge_base.py &&
        echo 'Starting API server...' &&
        uvicorn lablens.api.main:app --host 0.0.0.0 --port 8000 --reload
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lablens-network

  # Streamlit Frontend Service
  app:
    build: .
    container_name: lablens-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - LABLENS_API_URL=${LABLENS_BASE_URL:-http://api:8000/}api/chat/
    command: >
      sh -c "
        echo 'Waiting for API to be ready...' &&
        sleep 5 &&
        echo 'Starting Streamlit app...' &&
        streamlit run src/lablens/integrations/streamlit/main.py --server.port=8501 --server.address=0.0.0.0
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lablens-network

  # Slack Integration Service
  slack:
    build: .
    container_name: lablens-slack
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000
    command: uvicorn lablens.integrations.slack.main:app --host 0.0.0.0 --port 8001
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lablens-network

  # Cloudflare Tunnel Service
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: lablens-tunnel
    env_file:
      - .env
    command: tunnel run --protocol http2 --token ${CLOUDFLARE_TOKEN}
    restart: unless-stopped
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_healthy

networks:
  lablens-network:
    driver: bridge
