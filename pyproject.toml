[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lablens"
version = "0.1.0"
description = "LabLens: Scientific Research AI Assistant"
requires-python = ">=3.12,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
authors = [
    {name = "Cainã Max Couto da Silva", email = "cmcouto.silva@gmail.com"},
]
readme = "README.md"
keywords = []
dependencies = [
    "agentic-doc",
    "faiss-cpu",
    "firecrawl-py",
    "httpx",
    "ipywidgets",
    "fastapi",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "langchain-text-splitters",
    "langgraph",
    "loguru",
    "matplotlib",
    "pandas",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "requests",
    "seaborn",
    "slack-bolt",
    "uvicorn",
]

[project.optional-dependencies]
app = [
    "streamlit",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = false

[tool.hatch.build]
packages = ["src/lablens"]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest-cov",
    "pytest",
    "ruff",
]
notebook = [
    "ipykernel",
]

[tool.uv]
default-groups = ["dev", "notebook"]

[tool.ruff]
line-length = 88   # Like Black, use 88 characters per line.
indent-width = 4   # Like Black, use 4 spaces per indentation level.
exclude = ["*.ipynb"] # Exclude Jupyter notebooks from linting.

[tool.ruff.lint]
select = [
    "F",      # Pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "N",      # pep8-naming
    "Q",      # flake8-quotes
    "UP",     # pyupgrade
    # "D",      # pydocstyle
    "RUF",    # Ruff-specific rules
    "B",      # flake8-bugbear
    "T20",    # flake8-print
    "C90",    # mccabe (complex structures)
    "SIM",    # flake8-simplify
    "ANN",    # flake8-annotations
    "TID",    # flake8-tidy-imports
]
ignore = [] # ignore specific rules here

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
